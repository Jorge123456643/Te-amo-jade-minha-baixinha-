<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo Jade ❤️</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

function heart(t) {
    const x = 16 * Math.sin(t) ** 3;
    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return { x, y };
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    const scale = Math.min(canvas.width, canvas.height) * 0.025;
    const N = 140;
    const K = 2.1;

    for (let i = 0; i < N; i++) {

        const ang = (Math.PI * 2 * i) / N;
        const h = heart(ang);

        const hx = cx + h.x * scale;
        const hy = cy - h.y * scale;

        const ex = cx + h.x * scale * K;
        const ey = cy - h.y * scale * K;

        const gradient = ctx.createLinearGradient(hx, hy, ex, ey);

        gradient.addColorStop(0, "rgba(255,40,30,1)");
        gradient.addColorStop(0.5, "rgba(255,20,20,0.5)");
        gradient.addColorStop(1, "rgba(255,0,0,0)");

        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(ex, ey);

        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
