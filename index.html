<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo Jade ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

function heart(t) {
    return {
        x: 16 * Math.sin(t) ** 3,
        y: 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t)
    };
}

let progress = 0;

function animate() {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    const scale = Math.min(canvas.width, canvas.height) * 0.025;

    const totalLines = 140;

    // Quantas linhas já foram formadas
    const visibleLines = Math.floor(progress);

    for (let i = 0; i < visibleLines; i++) {

        const angle = (Math.PI * 2 * i) / totalLines;

        const h = heart(angle);

        const hx = cx + h.x * scale;
        const hy = cy - h.y * scale;

        const K = 2.1;

        const ex = cx + h.x * scale * K;
        const ey = cy - h.y * scale * K;

        const gradient = ctx.createLinearGradient(
            hx, hy, ex, ey
        );

        gradient.addColorStop(0, "rgba(255,40,30,1)");
        gradient.addColorStop(0.45, "rgba(255,20,20,0.6)");
        gradient.addColorStop(1, "rgba(255,0,0,0)");

        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(ex, ey);

        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    // Linha atual sendo formada
    if (visibleLines < totalLines) {

        const angle =
            (Math.PI * 2 * visibleLines) / totalLines;

        const h = heart(angle);

        const hx = cx + h.x * scale;
        const hy = cy - h.y * scale;

        const K = 2.1;

        const ex = cx + h.x * scale * K;
        const ey = cy - h.y * scale * K;

        const f = progress - visibleLines;

        const currentX = hx + (ex - hx) * f;
        const currentY = hy + (ey - hy) * f;

        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(currentX, currentY);

        ctx.strokeStyle = "#ff2020";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    progress += 0.45;

    // Quando terminar, reinicia depois de um pequeno tempo
    if (progress > totalLines + 80) {
        progress = 0;
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
